name: Audit Dependencies Security

on:
  pull_request:

jobs:
  dependency-check:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    name: Run Audit
    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]
    steps:
      - name: Checkout the code
        uses: actions/checkout@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run npm audit
        run: npm audit
